<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome · Jiyu’s Word Garden</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f1fc;color:#332347;font:18px system-ui,sans-serif;padding:22px}.card{width:min(440px,100%);background:white;border:1px solid #ded4ed;border-radius:26px;padding:36px;box-shadow:0 14px 40px #3323470b}h1{font-size:32px;line-height:1.15;margin:16px 0}p{line-height:1.6;color:#756b83}label{display:block;font-size:15px;font-weight:700;margin:20px 0 7px}input{width:100%;padding:14px;border:1px solid #d6cce5;border-radius:12px;font:inherit}input:focus{outline:3px solid #dbcef1}button{margin-top:25px;width:100%;padding:15px;background:#7860be;color:white;border:0;border-radius:13px;font:700 18px system-ui;cursor:pointer}.flower{font-size:47px}.error{background:#fff0e9;color:#9d4536;padding:12px;border-radius:10px;font-size:16px}.note{font-size:14px;text-align:center;margin:22px 0 0}
</style></head><body><main class="card"><div class="flower">🌷</div><h1>Jiyu’s Word Garden</h1><p>A little space for our family.<br>Log in to keep growing together.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="username">Family username</label><input id="username" name="username" value="{{ username }}" autocomplete="username" required maxlength="200"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1000"><button type="submit">Enter our garden</button></form><p class="note">One family account. One growing garden.</p></main></body></html>
